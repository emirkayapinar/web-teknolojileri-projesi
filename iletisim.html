    <main class="container mt-5 mb-5" id="app">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <h2 class="fw-bold text-center mb-4">Benimle İletişime Geçin</h2>
                    
                    <form id="iletisimFormu" action="islem.php" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Adınız ve Soyadınız</label>
                            <input type="text" class="form-control" name="ad" id="isim" v-model="form.ad" placeholder="Örn: Mustafa Emir">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">E-Posta Adresiniz</label>
                            <input type="email" class="form-control" name="email" id="email" v-model="form.email" placeholder="ornek@mail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Telefon Numaranız</label>
                            <input type="tel" class="form-control" name="tel" id="telefon" v-model="form.tel" placeholder="0555 123 45 67">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold d-block">Durumunuz</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="durum" value="Öğrenci" v-model="form.durum">
                                <label class="form-check-label">Öğrenciyim</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="durum" value="Mezun" v-model="form.durum">
                                <label class="form-check-label">Mezunum</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mesajınızın Konusu</label>
                            <select class="form-select" name="konu" v-model="form.konu">
                                <option value="">Lütfen bir konu seçin...</option>
                                <option value="İstek">İstek</option>
                                <option value="Şikayet">Şikayet</option>
                                <option value="Öneri">Öneri</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mesajınız</label>
                            <textarea class="form-control" name="mesaj" id="mesaj" v-model="form.mesaj" rows="4" placeholder="Mesajınızı buraya yazınız..."></textarea>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="onay" v-model="form.onay">
                                <label class="form-check-label small text-muted">Bilgilerimin doğruluğunu onaylıyorum.</label>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="reset" class="btn btn-outline-secondary px-4">Temizle</button>
                            <button type="button" class="btn btn-danger px-4 fw-bold" onclick="nativeKontrol()">Native JS Gönder</button>
                            <button type="button" class="btn btn-success px-4 fw-bold" @click="vueKontrol">Vue.js Gönder</button>
                        </div>
                    </form>
                </div>
            </div>

    <script>
        // --- YÖNTEM 1: NATIVE (SAF) JAVASCRIPT ---
        function nativeKontrol() {
            // Verileri çek ve boşlukları temizle (trim)
            let isim = document.getElementById("isim").value.trim();
            let email = document.getElementById("email").value.trim();
            let telefon = document.getElementById("telefon").value.trim();
            let mesaj = document.getElementById("mesaj").value.trim();
            let onay = document.getElementById("onay").checked;

            // Regex Şartları: Geçersiz veri girişini engellemek için
            let isimSarti = /^[a-zA-ZğüşiöçĞÜŞİÖÇ\s]{5,50}$/; // Sadece harf, min 5 karakter
            let telSarti = /^5[0-9]{9}$/; // 5 ile başlayan, 10 haneli numara
            let emailSarti = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Standart mail formatı

            // Denetim döngüsü
            if (isim === "" || email === "" || telefon === "" || mesaj === "") {
                alert("Native JS: Lütfen tüm alanları doldurun!");
                return;
            }
            if (!isimSarti.test(isim)) {
                alert("Native JS: Lütfen geçerli bir isim girin (Sadece harf, min 5 karakter).");
                return;
            }
            if (!telSarti.test(telefon)) {
                alert("Native JS: Telefon 5 ile başlamalı ve 10 hane olmalı.");
                return;
            }
            if (!emailSarti.test(email)) {
                alert("Native JS: E-posta formatı hatalı.");
                return;
            }
            if (!onay) {
                alert("Native JS: Lütfen onay kutusunu işaretleyin.");
                return;
            }

            // Tüm kontroller geçerse formu sunucuya (PHP) gönder
            document.getElementById("iletisimFormu").submit();
        }

        // --- YÖNTEM 2: VUE.JS FRAMEWORK ---
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    // Form verilerinin Vue tarafındaki karşılıkları
                    form: { ad: '', email: '', tel: '', durum: '', konu: '', mesaj: '', onay: false }
                }
            },
            methods: {
                vueKontrol() {
                    // Vue tarafındaki Regex denetimleri
                    const isimSarti = /^[a-zA-ZğüşiöçĞÜŞİÖÇ\s]{5,50}$/;
                    const telSarti = /^5[0-9]{9}$/;

                    if (!isimSarti.test(this.form.ad)) {
                        alert("Vue.js: Geçersiz ad soyad formatı!");
                        return;
                    }
                    if (!telSarti.test(this.form.tel)) {
                        alert("Vue.js: Telefon numarası formatı hatalı!");
                        return;
                    }
                    if (!this.form.onay) {
                        alert("Vue.js: Onay kutusu işaretlenmelidir!");
                        return;
                    }

                    // Her şey tamamsa formu PHP'ye teslim et
                    document.getElementById("iletisimFormu").submit();
                }
            }
        }).mount('#app');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
